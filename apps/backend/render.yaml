services:
  - type: web
    name: kuchniapp-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENFOODFACTS_USER_AGENT
        value: KuchniApp/1.0 (contact@kuchniapp.pl)
